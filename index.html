<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Draw</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#000000">

  <style>
    :root {
      --bg:      #000;
      --panel:   #000;
      --border:  #000;
      --text:    #ddd;
      --word:    #eee;   /* colour of the word in the text box */
	  --w: 500px;     /* width of the whole layout */
    }

    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 3.5rem 1rem 3rem;
      background: var(--bg);
      color: var(--text);
    }

    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    /* ---------- menu button (top right) ---------- */
    #menuBtn {
      position: fixed;
      top: 0.6rem;
      right: 0.6rem;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 3px;
    }

    /* ---------- main layout ---------- */
	.row {
	  display: flex;
	  gap: 1rem;
	  align-items: stretch;
	  width: min(var(--w), 100%);
	  margin: 0 auto 1.5rem;
	}

    .imgbtn {
      display: block;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0px;
      line-height: 0;
    }
    .row .imgbtn { flex: none; margin: 0; }
    .imgbtn.wide { width: min(var(--w), 100%); margin: 0 auto; }

    #tile  { width: 90px; height: 90px; border-radius: 9px; }
    #photo {
      width: 100%;
      aspect-ratio: 500 / 230;
      object-fit: cover;
      border-radius: 0px;
      background: var(--panel);
    }

    .textbox {
      flex: 1;
      min-width: 0;
      margin: 0;
      padding: 0 0.8rem;
      font-family: "CMU Serif", Georgia, serif;
      font-size: 1.5rem;
      line-height: 1.2;
      color: var(--word);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0px;
    }
    sup, sub { line-height: 0; }

    /* ---------- menu dialog ---------- */
    dialog {
      width: min(560px, 92vw);
      max-height: 90vh;
      overflow: auto;
      padding: 1rem 1.2rem 1.2rem;
      text-align: left;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
    dialog h2 { margin: 0 0 0.8rem; font-size: 1.2rem; }
    dialog label.block { display: block; margin: 1rem 0 0.3rem; font-weight: bold; }
    dialog small { display: block; margin-bottom: 0.4rem; color: #94a3b8; }
    dialog textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 7rem;
      padding: 0.5rem;
      font: 0.95rem/1.4 monospace;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    dialog .check { display: flex; gap: 0.6rem; align-items: center; margin: 0.4rem 0; }
    dialog .check input { width: 1.3rem; height: 1.3rem; }
    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.2rem; }
    .actions button {
      padding: 0.6rem 1.1rem;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .actions button.primary { background: #0d9488; border-color: #0d9488; color: white; }
    .actions .spacer { flex: 1; }
  </style>
</head>

<body>
  <button id="menuBtn" aria-label="Menu" onclick="openMenu()">&#9776;</button>

  <div class="row">
    <button class="imgbtn" onclick="drawTile()" aria-label="New tile">
      <img id="tile" alt="">
    </button>
    <button class="textbox" id="label" onclick="drawText()"></button>
  </div>

  <button class="imgbtn wide" onclick="drawPhoto()" aria-label="New photo">
    <img id="photo" alt="">
  </button>

  <dialog id="menu">
    <h2>Settings</h2>

    <div class="check">
      <input type="checkbox" id="deckMode">
      <label for="deckMode">No-repeat mode (go through every item once before any repeats)</label>
    </div>

    <label class="block" for="textsBox">Words (one per line)</label>
    <small>Use ^2 for a superscript and _2 for a subscript; use braces for several characters, e.g. x^{10}.</small>
    <textarea id="textsBox" spellcheck="false"></textarea>

    <label class="block" for="photosBox">Photos (file paths, one per line)</label>
    <small>Files must already be in your repo, e.g. img/photo1.jpg</small>
    <textarea id="photosBox" spellcheck="false"></textarea>

    <div class="actions">
      <button class="primary" onclick="saveMenu()">Save</button>
      <button onclick="closeMenu()">Cancel</button>
      <span class="spacer"></span>
      <button onclick="fillMenu(DEFAULTS)">Defaults</button>
    </div>
  </dialog>
  <script src="items.js"></script>
  <script>

	// ---------------------------------------------------------------
    // Saved settings (localStorage, wrapped so a failure never breaks the page)
    // ---------------------------------------------------------------
    const KEY = "randomdraw.v1";
    let cfg = load();

    function load() {
      const out = JSON.parse(JSON.stringify(DEFAULTS));
      try {
        const saved = JSON.parse(localStorage.getItem(KEY));
        if (saved) {
          if (typeof saved.deck === "boolean") out.deck = saved.deck;
          for (const k of ["texts", "photos"]) {
            if (Array.isArray(saved[k])) out[k] = saved[k].map(String);
          }
        }
      } catch (e) {}
      return out;
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
    }

    // ---------------------------------------------------------------
    // Picking: random with no immediate repeat, or "deck" (no repeats
    // until every item has been shown, then reshuffle).
    // ---------------------------------------------------------------
    const state = {};   // per list: { last, deck }
    function resetState() {
      for (const k of ["text", "tile", "photo"]) state[k] = { last: -1, deck: [] };
    }
    resetState();

    function shuffledDeck(n, avoid) {
      const a = Array.from({ length: n }, (_, i) => i);
      for (let i = n - 1; i > 0; i--) {                 // Fisher-Yates
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      // draws come from the END, so keep the previous pick from being drawn first
      if (n > 1 && a[n - 1] === avoid) {
        const j = Math.floor(Math.random() * (n - 1));
        [a[n - 1], a[j]] = [a[j], a[n - 1]];
      }
      return a;
    }

    function nextIndex(key, n) {
      if (n === 0) return -1;
      const s = state[key];
      if (n === 1) { s.last = 0; return 0; }
      if (cfg.deck) {
        if (s.deck.length === 0) s.deck = shuffledDeck(n, s.last);
        s.last = s.deck.pop();
      } else {
        let i;
        do { i = Math.floor(Math.random() * n); } while (i === s.last);
        s.last = i;
      }
      return s.last;
    }

    // ---------------------------------------------------------------
    // Text formatting: ^ superscript, _ subscript (works for any character)
    // ---------------------------------------------------------------
    const SUP = /\^([^\s{}^_]|\{[^}]+\})/gu;
    const SUB = /_([^\s{}^_]|\{[^}]+\})/gu;
    const esc   = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const strip = s => s.replace(/[{}]/g, "");

    function toHTML(raw) {
      return esc(raw)
        .replace(SUP, (m, s) => `<sup>${strip(s)}</sup>`)
        .replace(SUB, (m, s) => `<sub>${strip(s)}</sub>`);
    }

	const TILE_FONT = 110;   // same size for every tile
    function tileSVG(letter, bg, fg) {
	  const size = TILE_FONT;
 	  const up = Math.round(size * 0.25), small = Math.round(size * 0.65);
  	  const y  = Math.round(100 + size * 0.32);
      const label = esc(letter)
        .replace(SUP, (m, s) => `<tspan dy="-${up}" font-size="${small}">${strip(s)}</tspan><tspan dy="${up}">​</tspan>`)
        .replace(SUB, (m, s) => `<tspan dy="${up}" font-size="${small}">${strip(s)}</tspan><tspan dy="-${up}">​</tspan>`);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">` +
        `<rect width="220" height="220" fill="${esc(bg)}"/>` +
        `<text x="110" y="${y}" font-size="${size}" text-anchor="middle" fill="${esc(fg)}">${label}</text>` +
        `</svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function parseTile(line) {
      const p = line.split("|").map(s => s.trim());
      return { letter: p[0] || "?", bg: p[1] || "#475569", fg: p[2] || "white" };
    }

    // ---------------------------------------------------------------
    // Drawing
    // ---------------------------------------------------------------
    const $ = id => document.getElementById(id);

    function drawText() {
      const i = nextIndex("text", cfg.texts.length);
      $("label").innerHTML = i < 0 ? "&mdash;" : toHTML(cfg.texts[i]);
    }
    function drawTile() {
      const i = nextIndex("tile", cfg.tiles.length);
      if (i < 0) { $("tile").removeAttribute("src"); return; }
      const t = parseTile(cfg.tiles[i]);
      $("tile").src = tileSVG(t.letter, t.bg, t.fg);
    }
    function drawPhoto() {
      const i = nextIndex("photo", cfg.photos.length);
      if (i < 0) { $("photo").removeAttribute("src"); return; }
      $("photo").src = cfg.photos[i];
    }
    function drawAll() { drawText(); drawTile(); drawPhoto(); }

    // ---------------------------------------------------------------
    // Menu
    // ---------------------------------------------------------------
    function fillMenu(src) {
      $("deckMode").checked = src.deck;
      $("textsBox").value   = src.texts.join("\n");
      $("photosBox").value  = src.photos.join("\n");
    }
    const lines = s => s.split("\n").map(x => x.trim()).filter(Boolean);

    function openMenu()  { fillMenu(cfg); $("menu").showModal(); }
    function closeMenu() { $("menu").close(); }
    function saveMenu() {
      cfg = {
        deck:   $("deckMode").checked,
        texts:  lines($("textsBox").value),
        tiles:  DEFAULTS.tiles,
        photos: lines($("photosBox").value),
      };
      save();
      resetState();
      drawAll();
      closeMenu();
    }

    drawAll();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
