<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Draw</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#000000">

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 1.5rem 1rem 3rem;
      background: #000000;
      color: #e5e7eb;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    /* Text in a box that works as a button */
    .textbox {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      color: #e5e7e7;
      min-width: 220px;
      padding: 0.8rem 2rem;
      margin: 1rem 0 1.5rem;
      background: #000000;
      border: 1px solid #111111;
      border-radius: 7px;
    }
    .textbox:active { background: #000000; }

    /* Images that work as buttons */
    .imgbtn {
      display: block;
      margin: 0 auto 1.5rem;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0px;
      line-height: 0;            /* removes the small gap under the image */
    }
    .imgbtn:active { transform: scale(0.97); }

    #tile {
      width: 110px;
      height: 110px;
      border-radius: 10px;
    }

    .imgbtn.wide { width: min(500px, 100%); }
    #photo {
      width: 100%;
      aspect-ratio: 500 / 230;
      object-fit: cover;         /* crops to fit instead of stretching */
      border-radius: 0px;
      background: #0b1330;       /* shown while the image loads */
    }

	.row {
	  display: flex;
	  gap: 1rem;
	  align-items: stretch;
	  width: min(500px, 100%);
	  margin: 0 auto 1.5rem;
	}
	.row .imgbtn {
	  margin: 0;
	  flex: none;
	}
	.row .textbox {
	  flex: 1;
	  min-width: 0;
	  margin: 0;
	  padding: 0 1rem;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	}
  </style>
</head>

<body>
	<div class="row">
	  <button class="imgbtn" onclick="drawTile()" aria-label="New tile">
		<img id="tile" alt="">
	  </button>
	  <button class="textbox" id="label" onclick="drawText()"></button>
	</div>

	<button class="imgbtn wide" onclick="drawPhoto()" aria-label="New photo">
	<img id="photo" alt="">
	</button>

  <script>
    // Generated tile images (colored square with a letter)
	function placeholder(color, letter, textColor) {
	  const svg =
	    `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">` +
	    `<rect width="220" height="220" fill="${color}"/>` +
	    `<text x="110" y="145" font-size="110" text-anchor="middle" fill="${textColor}">${letter}</text>` +
	    `</svg>`;
	  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
	}

    const texts = ["Major (Ionian)", "Melodic minor", "Harmonic minor", "Major pentatonic", "Minor pentatonic",
				   "Dorian","Phrygian","Lydian","Mixolydian","Aeolian","Locrian","Altered","Mixolydian ♭6"];

    const tiles = [
		placeholder("#7c3aed", "C<sub>3</sub>", "#000000"),
		placeholder("#7c3aed", "G<sub>♭</sub>", "#000000"),
		placeholder("#e11d48", "D<sub>7</sub>", "#003300"),
		placeholder("#9f1239", "A<sub>♭</sub>", "#000000"),
		placeholder("#eab308", "E<sub>♭</sub>", "#aa0000"),
		placeholder("#eab308", "B<sub>♭</sub>", "#0000aa"),
		placeholder("#eeeeee", "F", "#000000"),
		placeholder("#eeeeee", "C", "#000000"),
		placeholder("#eab308", "G", "#000000"),
		placeholder("#9f1239", "D", "#000000"),
		placeholder("#7c3aed", "A", "#000000"),
		placeholder("#e11d48", "E", "#000000"),
		placeholder("#eab308", "B", "#000000"),
		placeholder("#9f1239", "F<sup>♯</sup>", "#000000"),
		placeholder("#9f1239", "C<sup>♯</sup>", "#000000"),
    ];

    // EDIT THIS: the file names of the pictures in your img/ folder
    const photos = [
      "img/eg1.png",
      "img/snail.png",
    ];

    // Remember the previous pick of each list to avoid immediate repeats
    const last = { text: -1, tile: -1, photo: -1 };

    function pick(list, key) {
      let i;
      do {
        i = Math.floor(Math.random() * list.length);
      } while (i === last[key] && list.length > 1);
      last[key] = i;
      return list[i];
    }

    function drawText() { document.getElementById("label").innerHTML = pick(texts, "text"); }
    function drawTile()  { document.getElementById("tile").src  = pick(tiles, "tile"); }
    function drawPhoto() { document.getElementById("photo").src = pick(photos, "photo"); }

    // Draw everything on load
    drawText();
    drawTile();
    drawPhoto();

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
