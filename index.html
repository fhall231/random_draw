<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page scale properly on a phone screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#007755">
  <title>Random Draw</title>

  <!-- CSS: purely visual, safe to ignore at first -->
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 2rem 1rem;
      background: #000011;
    }
    #label { font-size: 2.5rem; margin: 1rem 0; }
    #pic   { width: 220px; height: 220px; object-fit: contain; border-radius: 16px; }
	button {
	  font-size: 1.2rem;
	  padding: 0.7rem 1.6rem;
	  margin: 0.3rem;
	  min-height: 48px;               /* comfortable tap target on a phone */
	  border: none;
	  border-radius: 12px;
	  background: #3b82f6;
	  color: white;
	  box-shadow: 0 4px 0 #1d4ed8;    /* the "thickness" under the button */
	  cursor: pointer;
	  transition: transform 0.05s, box-shadow 0.05s;
	}
	button:active {
	  transform: translateY(4px);     /* sinks into the shadow when pressed */
	  box-shadow: none;
	}
	button.secondary {
	  background: #e2e8f0;
	  color: #1e293b;
	  box-shadow: 0 4px 0 #94a3b8;
	}
  </style>
</head>

<body>
  <!-- HTML: the things that appear on screen. The id lets JavaScript find them. -->
  <h1 id="label">Press draw</h1>
  <img id="pic" alt="">
  <p>
	  <button class="secondary" onclick="drawText()">Text</button>
	  <button onclick="drawBoth()">Both</button>
	  <button class="secondary" onclick="drawImage()">Image</button>
  </p>

  <script>
	const texts  = ["Apple", "Banana", "Cherry", "Grape"];
	const images = [
	  placeholder("#e11d48", "A"),   // or "images/apple.png", ...
	  placeholder("#eab308", "B"),
	  placeholder("#9f1239", "C"),
	  placeholder("#7c3aed", "G"),
	];
	
	const last = { text: -1, image: -1 };   // previous pick for each list
	
	function pick(list, key) {
	  let i;
	  do {
	    i = Math.floor(Math.random() * list.length);
	  } while (i === last[key] && list.length > 1);
	  last[key] = i;
	  return list[i];
	}
	
	function drawText()  { document.getElementById("label").textContent = pick(texts, "text"); }
	function drawImage() { document.getElementById("pic").src = pick(images, "image"); }
	function drawBoth()  { drawText(); drawImage(); }
	
	drawBoth();   // draw on load
  </script>
</body>
</html>
